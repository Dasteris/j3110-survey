name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub Pages кэширует файлы на 10 минут: без метки версии браузер может взять
      # новую страницу со старым скриптом, и дашборд/анкета ломаются до сброса кэша.
      - name: Build site with versioned asset URLs
        run: |
          mkdir _site
          cp index.html admin.html style.css app.js admin.js common.js roster.js subjects.js firebase-config.js _site/
          version="${GITHUB_SHA::8}"
          sed -i -E "s/(src|href)=\"([A-Za-z0-9_-]+\.(js|css))\"/\1=\"\2?v=${version}\"/g" _site/index.html _site/admin.html
          grep -o '[a-z-]*\.\(js\|css\)?v=[0-9a-f]*' _site/*.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
