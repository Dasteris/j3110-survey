<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Опрос J3110</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <!-- ЛОГИН -->
    <div id="login-screen" class="card" hidden>
      <h1>Опрос группы J3110</h1>
      <p>Войдите по номеру ИСУ и личному коду, который прислал староста.</p>
      <label for="isu-input">ИСУ (табельный номер)</label>
      <input id="isu-input" type="text" inputmode="numeric" autocomplete="username" placeholder="Например: 400123" />
      <label for="code-input">Код</label>
      <input id="code-input" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" />
      <div class="error-msg" id="login-error"></div>
      <button id="login-btn" class="full-width">Войти</button>
    </div>

    <!-- ОПРОС -->
    <div id="survey-screen" hidden>
      <div class="top-row">
        <div>
          <div class="student-name" id="student-name"></div>
          <div class="subject-sub" id="week-label"></div>
        </div>
        <div class="top-actions">
          <button class="ghost" id="admin-link" hidden>Дашборд</button>
          <button class="ghost" id="logout-btn">Выйти</button>
        </div>
      </div>

      <p id="load-message" hidden></p>
      <button class="secondary" id="retry-btn" hidden>Повторить</button>

      <div id="survey-body" hidden>
        <div class="progress-dots" id="progress-dots"></div>

        <div class="carousel-viewport" id="carousel-viewport">
          <div class="carousel-track" id="carousel-track"></div>
        </div>

        <div class="nav-row">
          <button class="secondary" id="prev-btn">← Назад</button>
          <button id="next-btn">Далее →</button>
        </div>
        <div class="save-status" id="save-status"></div>
        <div class="save-status ok" id="done-message"></div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="common.js"></script>
  <script src="subjects.js"></script>
  <script src="app.js"></script>
</body>
</html>
